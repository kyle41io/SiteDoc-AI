# Render Blueprint — deploys SiteDoc AI as a Docker web service (free tier).
# Render builds the Dockerfile (Chromium preinstalled), runs a long-lived
# container (so the async job queue + scan work), and injects $PORT (the app's
# `next start` reads it; HOSTNAME=0.0.0.0 is set in the Dockerfile).
#
# Usage: Render → New → Blueprint → pick this repo → Apply.
#
# Free tier notes: 512 MB RAM (tight for Chromium — light pages scan fine, heavy
# pages may OOM & auto-restart), spins down after ~15 min idle (cold start on
# next hit), and has NO persistent disk (audits/screenshots reset on restart —
# fine for a demo). Bump `plan` to `standard` (2 GB) for a rock-solid link.
services:
  - type: web
    name: sitedoc-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: AUDIT_STORE
        value: sqlite
      # Only one Chromium at a time — critical on the 512 MB free tier.
      - key: SITEDOC_MAX_CONCURRENT_SCANS
        value: "1"
      # Optional. Leave unset to use the deterministic fallback. Set the real
      # value in the Render dashboard (never commit it).
      - key: OPENAI_API_KEY
        sync: false
