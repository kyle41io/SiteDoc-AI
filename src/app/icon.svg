<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SiteDoc AI">
  <!-- Pop Sheet mark: an inked sticker tile, sunburst sky, cream audit check. -->
  <defs>
    <clipPath id="tile">
      <rect x="5" y="5" width="54" height="54" rx="16" />
    </clipPath>
  </defs>

  <!-- Hard offset shadow -->
  <rect x="8" y="9" width="54" height="54" rx="16" fill="#171436" />

  <g clip-path="url(#tile)">
    <rect x="5" y="5" width="54" height="54" fill="#35a7e8" />
    <!-- Sunburst rays, drawn as wedges from the tile centre -->
    <g fill="#56bcf2">
      <path d="M32 32 L 71.1 15.8 L 76.5 30.6 Z" />
      <path d="M32 32 L 65.8 55.2 L 55.2 65.8 Z" />
      <path d="M32 32 L 30.6 76.5 L 15.8 71.1 Z" />
      <path d="M32 32 L -7.1 46.2 L -12.5 31.4 Z" />
      <path d="M32 32 L -1.8 8.8 L 8.8 -1.8 Z" />
      <path d="M32 32 L 33.4 -12.5 L 48.2 -7.1 Z" />
    </g>
  </g>

  <!-- Tile outline -->
  <rect x="5" y="5" width="54" height="54" rx="16" fill="none" stroke="#171436" stroke-width="5" />

  <!-- Audit check -->
  <path
    d="M18 33.5 L 28 43 L 46.5 21"
    fill="none"
    stroke="#171436"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M18 33.5 L 28 43 L 46.5 21"
    fill="none"
    stroke="#fff9ee"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
