<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SiteDoc AI">
  <!--
    Pop Sheet mark: an inked audit sheet under a lemon magnifier holding a bar
    chart. No background tile, so the mark drops straight into the masthead and
    still reads on a light or dark browser tab: every fill is a bright brand
    colour, and the ink outline is only the edge, never the whole silhouette.

    The outline follows the browser's colour scheme, matching how the app's line
    token flips. The bars keep the fixed ink, because they sit on the cream lens
    rather than on the tab. `favicon.ico` is rasterised from this file, and the
    rasteriser resolves the light branch.
  -->
  <style>
    .outline { stroke: #171436; }
    @media (prefers-color-scheme: dark) {
      .outline { stroke: #cec5f7; }
    }
  </style>

  <!-- Audit sheet -->
  <g class="outline" stroke-width="4" stroke-linejoin="round">
    <rect x="8" y="6" width="32" height="44" rx="5" fill="#35a7e8" />
  </g>
  <g fill="#fff9ee">
    <rect x="15" y="14" width="17" height="5" rx="2.5" />
    <rect x="15" y="24" width="12" height="5" rx="2.5" />
  </g>

  <!-- Magnifier handle, inked then filled, so it reads as one stroke -->
  <path
    d="M30 48 L 20.5 57.5"
    fill="none"
    class="outline"
    stroke-width="13"
    stroke-linecap="round"
  />
  <path
    d="M30 48 L 20.5 57.5"
    fill="none"
    stroke="#ffc93c"
    stroke-width="6"
    stroke-linecap="round"
  />

  <!-- Glass: cream lens, inked rim, lemon ring laid inside the ink -->
  <circle cx="40" cy="38" r="14.5" fill="#fff9ee" class="outline" stroke-width="9" />
  <g fill="#171436">
    <rect x="31.75" y="38" width="4.5" height="8" rx="1.5" />
    <rect x="37.75" y="32" width="4.5" height="14" rx="1.5" />
    <rect x="43.75" y="35" width="4.5" height="11" rx="1.5" />
  </g>
  <circle cx="40" cy="38" r="14.5" fill="none" stroke="#ffc93c" stroke-width="4.5" />
</svg>
